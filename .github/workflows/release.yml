name: Build and Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            target: mac-x64
          - os: macos-14
            target: mac-arm64
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package
        run: |
          if [ "${{ matrix.target }}" = "mac-x64" ]; then
            npx electron-builder --publish=never --mac --x64
          elif [ "${{ matrix.target }}" = "mac-arm64" ]; then
            npx electron-builder --publish=never --mac --arm64
          elif [ "${{ matrix.target }}" = "windows" ]; then
            npx electron-builder --publish=never --win
          else
            npx electron-builder --publish=never --linux
          fi

      - name: Upload Release Assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap

      - name: Upload Workflow Artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: builds-${{ matrix.os }}
          path: dist/*
