name: Build and Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: mac-x64
            arch: x64
            upload_glob: |
              dist/*-mac-x64.dmg
              dist/*-mac-x64.zip
              dist/*-mac-x64.dmg.blockmap
              dist/*-mac-x64.zip.blockmap
          - os: macos-14
            target: mac-arm64
            arch: arm64
            upload_glob: |
              dist/*-mac-arm64.dmg
              dist/*-mac-arm64.zip
              dist/*-mac-arm64.dmg.blockmap
              dist/*-mac-arm64.zip.blockmap
          - os: windows-latest
            target: windows
            upload_glob: |
              dist/*.exe
              dist/*.blockmap
          - os: ubuntu-latest
            target: linux
            upload_glob: |
              dist/*.AppImage
              dist/*.deb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Report host arch
        if: startsWith(matrix.target, 'mac-')
        shell: bash
        run: |
          uname -m
          node -p "process.platform + ' ' + process.arch"

      - name: Install Dependencies
        run: npm ci
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}

      - name: Build
        run: npm run build
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}

      - name: Package
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "mac-x64" ]; then
            npx --no-install electron-builder --publish=never --mac zip --x64
            for attempt in 1 2 3; do
              if npx --no-install electron-builder --publish=never --mac dmg --x64; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "DMG build failed after 3 attempts (mac-x64)."
                exit 1
              fi
              echo "DMG build attempt $attempt failed; forcing detach of stale mounted images and retrying..."
              hdiutil info | awk '/\/Volumes\/Tanda Player Lite/ {print $1}' | while read -r dev; do
                [ -n "$dev" ] && hdiutil detach "$dev" -force || true
              done
              sleep 5
            done
          elif [ "${{ matrix.target }}" = "mac-arm64" ]; then
            npx --no-install electron-builder --publish=never --mac zip --arm64
            for attempt in 1 2 3; do
              if npx --no-install electron-builder --publish=never --mac dmg --arm64; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "DMG build failed after 3 attempts (mac-arm64)."
                exit 1
              fi
              echo "DMG build attempt $attempt failed; forcing detach of stale mounted images and retrying..."
              hdiutil info | awk '/\/Volumes\/Tanda Player Lite/ {print $1}' | while read -r dev; do
                [ -n "$dev" ] && hdiutil detach "$dev" -force || true
              done
              sleep 5
            done
          elif [ "${{ matrix.target }}" = "windows" ]; then
            npx --no-install electron-builder --publish=never --win
          else
            npx --no-install electron-builder --publish=never --linux
          fi

      - name: Verify package integrity (macOS)
        if: startsWith(matrix.target, 'mac-')
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(ls dist/*-${{ matrix.target }}.dmg)
          zipf=$(ls dist/*-${{ matrix.target }}.zip)
          test -s "$dmg"
          test -s "$zipf"
          hdiutil verify "$dmg"
          unzip -t "$zipf" >/dev/null
          APP_BIN=$(find dist -type f -path "*Tanda Player Lite.app/Contents/MacOS/Tanda Player Lite" | head -n 1)
          APP_ROOT=$(dirname "$(dirname "$(dirname "$APP_BIN")")")
          if [ -z "$APP_BIN" ] || [ -z "$APP_ROOT" ]; then
            echo "Could not resolve packaged .app in dist/"
            exit 1
          fi
          if /usr/bin/codesign -dv "$APP_ROOT" >/dev/null 2>&1; then
            /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP_ROOT"
            sign_info=$(/usr/bin/codesign -dv --verbose=4 "$APP_ROOT" 2>&1 || true)
            if echo "$sign_info" | grep -q "Authority=Developer ID Application"; then
              echo "Developer ID signature detected for packaged app."
            else
              echo "Packaged app is ad-hoc/local signed; Gatekeeper assessment is expected to reject."
            fi
          else
            echo "Packaged app is unsigned (no local signing identity); skipping strict codesign verification."
          fi

      - name: Verify packaged app signature from DMG (macOS)
        if: startsWith(matrix.target, 'mac-')
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(ls dist/*-${{ matrix.target }}.dmg)
          mount_dir=$(mktemp -d)
          cleanup() {
            hdiutil detach "$mount_dir" -quiet || true
            rm -rf "$mount_dir"
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -nobrowse -mountpoint "$mount_dir" >/dev/null
          app=$(find "$mount_dir" -maxdepth 2 -name "Tanda Player Lite.app" | head -n 1)
          if [ -z "$app" ]; then
            echo "Tanda Player Lite.app not found in mounted DMG"
            exit 1
          fi
          if /usr/bin/codesign -dv "$app" >/dev/null 2>&1; then
            /usr/bin/codesign --verify --deep --strict --verbose=2 "$app"
            sign_info=$(/usr/bin/codesign -dv --verbose=4 "$app" 2>&1 || true)
            if echo "$sign_info" | grep -q "Authority=Developer ID Application"; then
              /usr/sbin/spctl -a -vv "$app"
            else
              echo "DMG app is not Developer ID signed (ad-hoc/local signing); skipping spctl Gatekeeper assessment."
            fi
          else
            echo "DMG app is unsigned (no local signing identity); skipping strict codesign/spctl verification."
          fi

      - name: Verify package integrity (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem -Path dist -Filter *.exe | Select-Object -First 1
          $blockmap = Get-ChildItem -Path dist -Filter *.exe.blockmap | Select-Object -First 1
          if (-not $exe) { throw "Missing .exe artifact in dist/" }
          if (-not $blockmap) { throw "Missing .exe.blockmap artifact in dist/" }
          if ($exe.Length -le 0) { throw "Installer .exe is empty: $($exe.FullName)" }
          if ($blockmap.Length -le 0) { throw "Blockmap is empty: $($blockmap.FullName)" }

      - name: Verify package integrity (Linux)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(ls dist/*.AppImage)
          deb=$(ls dist/*.deb)
          test -s "$appimage"
          test -s "$deb"
          file "$appimage" | grep -qi "ELF"
          dpkg-deb --info "$deb" >/dev/null

      - name: Verify macOS arch
        if: startsWith(matrix.target, 'mac-')
        shell: bash
        run: |
          ELECTRON_BIN=$(find node_modules/electron/dist -type f -path "*Electron.app/Contents/MacOS/Electron" | head -n 1)
          if [ -n "$ELECTRON_BIN" ]; then
            file "$ELECTRON_BIN"
          fi
          APP_BIN=$(find dist -type f -path "*Tanda Player Lite.app/Contents/MacOS/Tanda Player Lite" | head -n 1)
          if [ -z "$APP_BIN" ]; then
            echo "App binary not found in dist."
            exit 1
          fi
          file "$APP_BIN"
          if [ "${{ matrix.target }}" = "mac-arm64" ]; then
            file "$APP_BIN" | grep -q "arm64" || { echo "Expected arm64 build."; exit 1; }
          else
            file "$APP_BIN" | grep -q "x86_64" || { echo "Expected x86_64 build."; exit 1; }
          fi

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: builds-${{ matrix.target }}
          path: ${{ matrix.upload_glob }}
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find dist -type f \
            \( -name "*.dmg" \
            -o -name "*.zip" \
            -o -name "*.dmg.blockmap" \
            -o -name "*.zip.blockmap" \
            -o -name "*.exe" \
            -o -name "*.exe.blockmap" \
            -o -name "*.AppImage" \
            -o -name "*.deb" \) \
            -print0 | while IFS= read -r -d '' file; do
              base="$(basename "$file")"
              target="release-assets/$base"
              if [ -e "$target" ]; then
                if cmp -s "$file" "$target"; then
                  echo "Duplicate (identical) asset ignored: $file"
                  continue
                fi
                echo "Conflicting asset basename detected: $base"
                echo "Existing: $target"
                echo "New: $file"
                exit 1
              fi
              cp "$file" "$target"
            done
          echo "Prepared release assets:"
          ls -1 release-assets

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*-mac-x64.dmg
            release-assets/*-mac-x64.zip
            release-assets/*-mac-x64.dmg.blockmap
            release-assets/*-mac-x64.zip.blockmap
            release-assets/*-mac-arm64.dmg
            release-assets/*-mac-arm64.zip
            release-assets/*-mac-arm64.dmg.blockmap
            release-assets/*-mac-arm64.zip.blockmap
            release-assets/*-win-*.exe
            release-assets/*-win-*.exe.blockmap
            release-assets/*.AppImage
            release-assets/*.deb
          fail_on_unmatched_files: true

  upload-dispatch-artifacts:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: builds-all
          path: dist/**
