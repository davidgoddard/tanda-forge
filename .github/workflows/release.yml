name: Build and Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: mac-x64
            arch: x64
          - os: macos-14
            target: mac-arm64
            arch: arm64
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Report host arch
        if: startsWith(matrix.target, 'mac-')
        shell: bash
        run: |
          uname -m
          node -p "process.platform + ' ' + process.arch"

      - name: Install Dependencies
        run: npm ci
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}

      - name: Build
        run: npm run build
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}

      - name: Package
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "mac-x64" ]; then
            npx electron-builder --publish=never --mac --x64
          elif [ "${{ matrix.target }}" = "mac-arm64" ]; then
            npx electron-builder --publish=never --mac --arm64
          elif [ "${{ matrix.target }}" = "windows" ]; then
            npx electron-builder --publish=never --win
          else
            npx electron-builder --publish=never --linux
          fi

      - name: Verify macOS arch
        if: startsWith(matrix.target, 'mac-')
        shell: bash
        run: |
          ELECTRON_BIN=$(find node_modules/electron/dist -type f -path "*Electron.app/Contents/MacOS/Electron" | head -n 1)
          if [ -n "$ELECTRON_BIN" ]; then
            file "$ELECTRON_BIN"
          fi
          APP_BIN=$(find dist -type f -path "*Tanda Player Lite.app/Contents/MacOS/Tanda Player Lite" | head -n 1)
          if [ -z "$APP_BIN" ]; then
            echo "App binary not found in dist."
            exit 1
          fi
          file "$APP_BIN"
          if [ "${{ matrix.target }}" = "mac-arm64" ]; then
            file "$APP_BIN" | grep -q "arm64" || { echo "Expected arm64 build."; exit 1; }
          else
            file "$APP_BIN" | grep -q "x86_64" || { echo "Expected x86_64 build."; exit 1; }
          fi

      - name: Upload Release Assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap

      - name: Upload Workflow Artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: builds-${{ matrix.os }}
          path: dist/*
