name: Build and Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: mac-x64
            arch: x64
            upload_glob: |
              dist/*-mac-x64.dmg
              dist/*-mac-x64.zip
              dist/*-mac-x64.dmg.blockmap
              dist/*-mac-x64.zip.blockmap
          - os: macos-14
            target: mac-arm64
            arch: arm64
            upload_glob: |
              dist/*-mac-arm64.dmg
              dist/*-mac-arm64.zip
              dist/*-mac-arm64.dmg.blockmap
              dist/*-mac-arm64.zip.blockmap
          - os: windows-latest
            target: windows
            upload_glob: |
              dist/*.exe
              dist/*.blockmap
          - os: ubuntu-latest
            target: linux
            upload_glob: |
              dist/*.AppImage
              dist/*.deb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Report host arch
        if: startsWith(matrix.target, 'mac-')
        shell: bash
        run: |
          uname -m
          node -p "process.platform + ' ' + process.arch"

      - name: Install Dependencies
        run: npm ci
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}

      - name: Build
        run: npm run build
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}

      - name: Package
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "mac-x64" ]; then
            npx electron-builder --publish=never --mac --x64
          elif [ "${{ matrix.target }}" = "mac-arm64" ]; then
            npx electron-builder --publish=never --mac --arm64
          elif [ "${{ matrix.target }}" = "windows" ]; then
            npx electron-builder --publish=never --win
          else
            npx electron-builder --publish=never --linux
          fi

      - name: Verify macOS arch
        if: startsWith(matrix.target, 'mac-')
        shell: bash
        run: |
          ELECTRON_BIN=$(find node_modules/electron/dist -type f -path "*Electron.app/Contents/MacOS/Electron" | head -n 1)
          if [ -n "$ELECTRON_BIN" ]; then
            file "$ELECTRON_BIN"
          fi
          APP_BIN=$(find dist -type f -path "*Tanda Player Lite.app/Contents/MacOS/Tanda Player Lite" | head -n 1)
          if [ -z "$APP_BIN" ]; then
            echo "App binary not found in dist."
            exit 1
          fi
          file "$APP_BIN"
          if [ "${{ matrix.target }}" = "mac-arm64" ]; then
            file "$APP_BIN" | grep -q "arm64" || { echo "Expected arm64 build."; exit 1; }
          else
            file "$APP_BIN" | grep -q "x86_64" || { echo "Expected x86_64 build."; exit 1; }
          fi

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: builds-${{ matrix.target }}
          path: ${{ matrix.upload_glob }}
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.dmg
            dist/**/*.zip
            dist/**/*.dmg.blockmap
            dist/**/*.zip.blockmap
            dist/**/*.exe
            dist/**/*.blockmap
            dist/**/*.AppImage
            dist/**/*.deb
          fail_on_unmatched_files: true

  upload-dispatch-artifacts:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: builds-all
          path: dist/**
